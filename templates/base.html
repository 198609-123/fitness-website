<!DOCTYPE html>
<!--
  base.html —— 母版模板（所有页面的“骨架”）
  ------------------------------------------------------------------
  作用（对应你列的“优先级 3：没有母版模板”）：
    之前每个页面都手动写 <head>、<style>、返回首页链接，重复且难维护。
    现在把【公共部分】抽到这里，其他页面用 Jinja 的 extends 语法继承它，
    只填自己独有的内容（通过 block 占位）。

  为什么这对“接 AI 助手”特别关键：
    把 AI 助手的浮动窗口写进这个母版，全站每个页面就自动带上它，
    以后要改助手样式/逻辑，只改这里一处即可。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title 用 block 占位，子页面可覆盖；不覆盖就用默认文字 -->
    <title>{% block title %}减脂计算器{% endblock %}</title>
    <!-- 唯一一份公共样式，全站引用这一个文件 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 子页面如果要在 head 里加自己的东西（如内联脚本），用这个 block -->
    {% block head %}{% endblock %}
</head>
<body>
    <!-- ===== 页面正文：每个子页面用自己的内容替换这个 block ===== -->
    {% block content %}{% endblock %}

    <!-- ===== 全站 AI 助手浮动组件（写在母版里，每个页面自动拥有） ===== -->
    <!-- 右下角圆形按钮，点一下展开聊天面板 -->
    <button class="ai-fab" id="aiFab" title="AI 减脂助手">💬</button>

    <!-- 聊天面板：默认隐藏（CSS 里 display:none），点按钮后由 JS 加 .open 显示 -->
    <div class="ai-panel" id="aiPanel">
        <div class="ai-panel-header">
            <span>🤖 AI 减脂助手</span>
            <span class="ai-panel-close" id="aiClose">&times;</span>
        </div>
        <div class="ai-messages" id="aiMessages">
            <div class="ai-msg bot">你好！我是基于健身文献知识库的 AI 助手，问我减脂、增肌、饮食相关问题都可以～</div>
        </div>
        <div class="ai-input-row">
            <input type="text" id="aiInput" placeholder="例如：减肥每天该吃多少蛋白质？" />
            <button id="aiSend">发送</button>
        </div>
    </div>

    <!-- 助手的交互逻辑（开关面板、发请求、渲染答案与引用）放在独立 JS 文件 -->
    <script src="/static/js/ai-assistant.js"></script>
    <!-- 子页面如果要在 body 末尾加脚本，用这个 block -->
    {% block scripts %}{% endblock %}
</body>
</html>
